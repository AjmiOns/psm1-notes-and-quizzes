<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 7: Scrum Artifacts</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f5f2fc; --line: #d9d3ee;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #5b4b9a; --accent-tint: #e6e0f8; --on-accent: #ffffff;
    --ok: #2f7d5b; --ok-tint: #ddf3e8;
    --bad: #a8465e; --bad-tint: #fbe0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>7. Scrum Artifacts</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "Which artifact and commitment pairs are correct?",
    options: ["Product Backlog / Sprint Goal, Sprint Backlog / Product Goal, Increment / Definition of Done", "Product Backlog / Product Goal, Sprint Backlog / Sprint Goal, Increment / Definition of Done", "Product Backlog / Definition of Done, Sprint Backlog / Product Goal, Increment / Sprint Goal", "Product Backlog / Product Goal, Sprint Backlog / Definition of Done, Increment / Sprint Goal"],
    answer: 1,
    why: "Each artifact has one commitment: the Product Goal for the Product Backlog, the Sprint Goal for the Sprint Backlog and the Definition of Done for the Increment." },
  { q: "By which criterion is the Product Backlog ordered?",
    options: ["Size of the items", "Value for the product and its customers", "The order in which stakeholders requested them", "Effort estimated by the Developers"],
    answer: 1,
    why: "Items with a higher value for the product are at the top of the Product Backlog, which is managed and ordered by the Product Owner." },
  { q: "Who is accountable for creating Product Backlog items?",
    options: ["The Product Owner, who may delegate the work but remains accountable", "Only the Product Owner, delegation is not allowed", "The Scrum Master", "The stakeholders"],
    answer: 0,
    why: "Scrum allows the Product Owner to delegate, for example to the Developers, but the Product Owner remains accountable." },
  { q: "When is the Product Backlog complete?",
    options: ["When all stakeholders have approved it", "When it contains enough items for three Sprints", "At the end of Sprint Planning", "Never: it keeps growing and evolving as the product and its environment change"],
    answer: 3,
    why: "The Product Backlog is never complete. It reflects changes in the environment and in the requirements of the product." },
  { q: "What is Product Backlog refinement?",
    options: ["A Scrum event held at the end of each Sprint", "The act of breaking down and further defining Product Backlog items into smaller, more precise items", "The Product Owner's yearly review of the Product Goal", "The estimation of the Sprint velocity"],
    answer: 1,
    why: "Refinement is an ongoing activity in which the Developers are involved. It is not a Scrum event." },
  { q: "Why do items at the top of the Product Backlog tend to be smaller than items at the bottom?",
    options: ["Because the Developers can only select small items", "Because larger items are always lower in value", "Because the Scrum Master splits them during the Daily Scrum", "Because ongoing refinement focuses on the items that will be needed in the next Sprints"],
    answer: 3,
    why: "Refining high-priority items matters more than refining items that are not relevant for the next Sprints, so the top items are smaller and more precise." },
  { q: "What does the Product Goal describe?",
    options: ["The list of tasks for the current Sprint", "A future state of the product that serves as a target for the Scrum Team to plan against", "The quality criteria for an Increment", "The company vision"],
    answer: 1,
    why: "The Product Goal is the long-term objective of the Scrum Team and part of the Product Backlog." },
  { q: "Who is accountable for developing and communicating the Product Goal?",
    options: ["The Scrum Master", "The Developers", "The Product Owner", "The stakeholders"],
    answer: 2,
    why: "The Product Goal is part of the Product Backlog, which the Product Owner manages. The Product Owner is accountable for developing and communicating it." },
  { q: "Which of the following is NOT mentioned in the Scrum Guide?",
    options: ["Product Goal", "Sprint Goal", "Definition of Done", "Company vision and product vision"],
    answer: 3,
    why: "The Scrum Guide focuses on the product level: Product Goal and Sprint Goal. Company and product vision are not part of it." },
  { q: "What does the Sprint Backlog consist of?",
    options: ["The whole Product Backlog and the Sprint Goal", "The Sprint Goal (why), the selected Product Backlog items (what) and an actionable plan (how)", "The Increment and the Definition of Done", "The Product Goal, the Sprint Goal and the velocity"],
    answer: 1,
    why: "These three parts are created in Sprint Planning and together form the Sprint Backlog." },
  { q: "When must the Sprint Goal be finalized?",
    options: ["Before the end of Sprint Planning", "At the first Daily Scrum", "At the Sprint Review", "Before Sprint Planning by the Product Owner alone"],
    answer: 0,
    why: "The Product Owner proposes how the product could increase its value, the whole Scrum Team defines the Sprint Goal, and it must be finalized before Sprint Planning ends." },
  { q: "Who decides how the selected Product Backlog items are turned into work items?",
    options: ["The Product Owner", "The Scrum Master", "The Developers", "The stakeholders"],
    answer: 2,
    why: "The Developers plan the work, often decomposing items into work items of one day or less. No one else tells them how." },
  { q: "What is the purpose of the Sprint Goal?",
    options: ["To list all the tasks of the Sprint", "To measure the performance of each Developer", "To replace the Product Goal", "To create coherence and focus so the Scrum Team works together"],
    answer: 3,
    why: "The Sprint Goal is a single objective for the Sprint that encourages the team to work together, while leaving flexibility about the exact work." },
  { q: "How many objectives does a Sprint have besides the Sprint Goal?",
    options: ["One per Developer", "Two", "None: the Sprint Goal is the single objective for the Sprint", "As many as there are selected Product Backlog items"],
    answer: 2,
    why: "There are no further objectives for the team besides the Sprint Goal." },
  { q: "What must be true for an Increment?",
    options: ["It must be usable, additive to all prior Increments, and work together with them", "It must be approved by stakeholders in the Sprint Review", "It must contain all the selected Product Backlog items", "It must be released at the end of the Sprint"],
    answer: 0,
    why: "An Increment is a usable stepping stone toward the Product Goal. If it does not work with the earlier Increments, it cannot be released." },
  { q: "Can multiple Increments be created within a single Sprint?",
    options: ["No, exactly one Increment per Sprint", "Yes, as long as they work together; their sum is presented at the Sprint Review", "Only if the Sprint is longer than two weeks", "Only with the Product Owner's approval"],
    answer: 1,
    why: "Multiple Increments in one Sprint are fine. They must work together with each other and with prior Increments." },
  { q: "Can an Increment be released before the Sprint Review?",
    options: ["No, the Sprint Review is the gate for releases", "Only with stakeholder approval", "Only if the Scrum Master agrees", "Yes, as soon as it meets the Definition of Done"],
    answer: 3,
    why: "The Sprint Review should never be considered a gate to release value." },
  { q: "Who decides whether and when an Increment is released?",
    options: ["The Scrum Master", "The Product Owner", "The Developers", "The stakeholders"],
    answer: 1,
    why: "It is also fine not to release an Increment at all. The Product Owner decides." },
  { q: "What is the Definition of Done?",
    options: ["The Developers' task list for the Sprint", "The Product Owner's acceptance of each item", "A formal description of the state of an Increment when it meets the quality measures required for the product", "The criteria for cancelling a Sprint"],
    answer: 2,
    why: "It defines when an Increment is done and can be released, and creates transparency through a shared understanding of the completed work." },
  { q: "The organization already has a Definition of Done for all Scrum Teams. What should your Scrum Team do?",
    options: ["Ignore it and create its own", "Use the organizational one as a minimum and add anything else that is important to the team", "Use it unchanged and never add to it", "Ask the Product Owner to decide"],
    answer: 1,
    why: "A shared minimum ensures that the Increments of many Scrum Teams can be combined. The team may add further criteria." },
  { q: "A Product Backlog item does not meet the Definition of Done at the end of the Sprint. What happens?",
    options: ["It is presented at the Sprint Review as work in progress", "It is automatically moved to the next Sprint", "It is released with a warning", "It returns to the Product Backlog; the next Sprint Planning decides whether it is selected again"],
    answer: 3,
    why: "It cannot be released or even presented at the Sprint Review, and it is not automatically moved to the next Sprint." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
