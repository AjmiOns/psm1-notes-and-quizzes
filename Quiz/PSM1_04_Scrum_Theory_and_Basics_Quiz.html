<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 4: Scrum Theory &amp; Basics</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f5f2fc; --line: #d9d3ee;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #5b4b9a; --accent-tint: #e6e0f8; --on-accent: #ffffff;
    --ok: #2f7d5b; --ok-tint: #ddf3e8;
    --bad: #a8465e; --bad-tint: #fbe0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>4. Scrum Theory &amp; Basics</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "According to the Scrum Guide, what is Scrum?",
    options: ["A detailed methodology that prescribes every practice a team must use", "A lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems", "A project management plan for projects with fixed scope", "A set of tools for tracking tasks"],
    answer: 1,
    why: "Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems. It is not a detailed methodology and not a plan-driven approach." },
  { q: "What does it mean that Scrum is a \"lightweight\" framework?",
    options: ["It can only be used by small teams", "It provides guidance for interactions but no detailed instructions, so it does not prescribe user stories, story points or tools like Jira or Trello", "It has no accountabilities, events or artifacts", "It requires no Scrum Master"],
    answer: 1,
    why: "Scrum gives guidance for the team's interactions. Techniques and tools are decided by the self-managing team and tailored to its needs." },
  { q: "What does empiricism mean in Scrum?",
    options: ["Decisions are made from a detailed plan created before the project starts", "Knowledge comes from experience, and decisions are based on what is observed", "Decisions are made by the most senior person", "Work is done only after all requirements are known"],
    answer: 1,
    why: "Empiricism asserts that knowledge comes from experience and from making decisions based on what is observed. Like a thermostat that inspects the temperature and adapts it, Scrum relies on inspect and adapt feedback loops." },
  { q: "Which are the three pillars of Scrum?",
    options: ["Courage, focus and commitment", "Plan, build and release", "Transparency, inspection and adaptation", "Product Owner, Scrum Master and Developers"],
    answer: 2,
    why: "The three pillars of empirical process control are transparency, inspection and adaptation. Courage and focus are Scrum values, and the third option lists the accountabilities." },
  { q: "Is Sprint Planning a formal event for inspection and adaptation?",
    options: ["No, only the Sprint Review and Sprint Retrospective are", "No, only the Daily Scrum is", "Yes, but only in the first Sprint", "Yes, all Scrum events are events for inspection and adaptation"],
    answer: 3,
    why: "Scrum combines four formal events for inspection and adaptation, inside the Sprint as the containing event. All of them (Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective) qualify." },
  { q: "Which statement about the skills of a Scrum Team is correct?",
    options: ["Every individual member must have all the skills needed to turn an item into an Increment", "The team as a whole must have all skills and expertise needed, and share or acquire them as needed", "Missing skills must always be provided by other teams", "Only the Product Owner needs all the skills"],
    answer: 1,
    why: "Not every member needs all skills, but the team as a collective does. This lets the team plan its work without depending on other teams or experts." },
  { q: "Which of these is NOT one of the five Scrum values?",
    options: ["Courage", "Collaboration", "Openness", "Respect"],
    answer: 1,
    why: "The five Scrum values are courage, focus, commitment, respect and openness. Collaboration is not one of them. Do not mix them up with the four values of the Agile Manifesto." },
  { q: "Which statement about the Scrum value of commitment is correct?",
    options: ["The Product Owner decides how many items go into the Sprint Backlog", "The Scrum Master assigns tasks to each Developer", "Stakeholders decide the amount of work for the Sprint", "The team itself decides how much to take on in Sprint Planning, and the Product Owner must not pressure it to overcommit"],
    answer: 3,
    why: "In Scrum the team decides how much it wants to achieve in the Sprint and is accountable to deliver. The Product Owner should not force overcommitment." },
  { q: "Which value means the team feels safe enough to say no to additional tasks that would result in overcommitment?",
    options: ["Focus", "Respect", "Courage", "Commitment"],
    answer: 2,
    why: "Courage means doing the right thing and working on tough problems, including saying no to extra tasks and asking for help when needed." },
  { q: "Which option correctly pairs each artifact with its commitment?",
    options: ["Product Backlog: Sprint Goal. Sprint Backlog: Product Goal. Increment: Definition of Done", "Product Backlog: Product Goal. Sprint Backlog: Sprint Goal. Increment: Definition of Done", "Product Backlog: Definition of Done. Sprint Backlog: Product Goal. Increment: Sprint Goal", "Product Backlog: Sprint Goal. Sprint Backlog: Definition of Done. Increment: Product Goal"],
    answer: 1,
    why: "Each artifact has a commitment: the Product Backlog has the Product Goal, the Sprint Backlog has the Sprint Goal, and the Increment has the Definition of Done." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
