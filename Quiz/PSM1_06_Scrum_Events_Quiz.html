<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 6: Scrum Events</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f5f2fc; --line: #d9d3ee;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #5b4b9a; --accent-tint: #e6e0f8; --on-accent: #ffffff;
    --ok: #2f7d5b; --ok-tint: #ddf3e8;
    --bad: #a8465e; --bad-tint: #fbe0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>6. Scrum Events</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "How many Scrum events are there, according to the Scrum Guide?",
    options: ["Four: Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective", "Five: the Sprint, Sprint Planning, Daily Scrum, Sprint Review and Sprint Retrospective", "Six, including Product Backlog refinement", "Three: Planning, Review and Retrospective"],
    answer: 1,
    why: "The Sprint itself is a Scrum event and acts as the container for all the others. Product Backlog refinement is not part of the Scrum framework." },
  { q: "What happens between the end of one Sprint and the start of the next?",
    options: ["A planning break of up to one day", "A short gap decided by the Scrum Master", "Nothing: a new Sprint starts immediately after the previous one ends", "A Sprint Zero to prepare the next Sprint"],
    answer: 2,
    why: "There is no time between two Sprints. A new Sprint always starts immediately after the conclusion of the previous one." },
  { q: "What is the maximum length of a Sprint?",
    options: ["Two weeks", "Three weeks", "Six weeks", "One month"],
    answer: 3,
    why: "A Sprint is a timebox of one month or less, and its length should be the same for every Sprint to create consistency." },
  { q: "The Developers realize during the Sprint that part of the scope should be removed. What is the correct action?",
    options: ["They remove it on their own, because they are self-managing", "They talk with the Product Owner and renegotiate the Sprint scope as more is learned", "They wait until the Sprint Review to mention it", "They ask the Scrum Master to remove it from the Sprint Backlog"],
    answer: 1,
    why: "Removing scope is allowed, but never by the Developers alone. They renegotiate the Sprint scope with the Product Owner." },
  { q: "When can a Sprint be cancelled before its timebox is over?",
    options: ["When the Developers think they will not finish all items", "When a stakeholder asks for it", "When the Sprint Goal becomes obsolete", "When the Scrum Master decides the Sprint is going badly"],
    answer: 2,
    why: "A Sprint can only be cancelled if the Sprint Goal becomes obsolete, for example because new regulations make the planned feature impossible. Then a new Sprint Planning is held with the whole team." },
  { q: "Why are Sprints longer than one month not allowed?",
    options: ["Because the Scrum Master cannot manage longer Sprints", "Because the Sprint Goal may become invalid, complexity may rise and risk may increase, and learning cycles get longer", "Because stakeholders would lose interest", "Because the Sprint Review would last more than four hours"],
    answer: 1,
    why: "Shorter Sprints generate more learning cycles and limit the risk of cost and effort to a smaller timeframe. Long Sprints also delay inspection and adaptation." },
  { q: "What are the three topics addressed in Sprint Planning?",
    options: ["Who, when and where", "Why (Sprint Goal), what (Product Backlog items) and how (plan for the work)", "Scope, budget and deadline", "Backlog, burndown and velocity"],
    answer: 1,
    why: "Sprint Planning answers why the Sprint is valuable, what can be done and how the chosen work will get done. Together they form the Sprint Backlog." },
  { q: "The Product Owner wants the Developers to take more Product Backlog items into the Sprint than they selected. What can the Product Owner do?",
    options: ["Force the Developers to select them", "Ask the Scrum Master to overrule the Developers", "Nothing binding: no one can force Developers to overcommit, even if the items are important", "Add the items to the Sprint Backlog without telling the Developers"],
    answer: 2,
    why: "The Developers select the Product Backlog items they can commit to deliver. The Product Owner can explain why items are important, but cannot force more work on the team." },
  { q: "Who decides how Product Backlog items are turned into an Increment?",
    options: ["The Product Owner", "The Scrum Master", "The stakeholders", "The Developers"],
    answer: 3,
    why: "The Developers plan the work needed to create an Increment that meets the Definition of Done. How this is done is up to them, not the Product Owner or the Scrum Master." },
  { q: "Who must participate in Sprint Planning?",
    options: ["Only the Product Owner and the Developers", "The whole Scrum Team; stakeholders are optional and only if invited", "The Scrum Team and all key stakeholders", "Only the Developers"],
    answer: 1,
    why: "The Product Owner, Developers and Scrum Master must participate. The Sprint Goal is created by the whole Scrum Team. Stakeholders may join only if the Scrum Team invites them." },
  { q: "What is the maximum timebox of Sprint Planning for a one-month Sprint?",
    options: ["4 hours", "6 hours", "8 hours", "15 minutes"],
    answer: 2,
    why: "Sprint Planning is timeboxed to a maximum of 8 hours for a one-month Sprint. For shorter Sprints it is usually shorter, for example 4 hours for a two-week Sprint, but never longer." },
  { q: "For whom is the Daily Scrum an event, and how long is its timebox?",
    options: ["For the whole Scrum Team and stakeholders, 30 minutes", "For the Developers, 15 minutes", "For the Scrum Master, 15 minutes", "For the Product Owner and Developers, 30 minutes"],
    answer: 1,
    why: "The Daily Scrum is a 15-minute event for the Developers, held at the same time and place every working day of the Sprint." },
  { q: "The Scrum Master is working on a Sprint Backlog item and attends the Daily Scrum. In what role does the Scrum Master participate?",
    options: ["As the Scrum Master, to moderate the event", "As a Developer, because they are actively working on Sprint Backlog items", "As a stakeholder", "They are not allowed to attend"],
    answer: 1,
    why: "The Product Owner and Scrum Master do not have to attend. If they work on Sprint Backlog items, they take part as Developers. They may also just listen." },
  { q: "Which statement about the structure of the Daily Scrum is correct?",
    options: ["Every Developer must answer the three questions: yesterday, today, impediments", "The Scrum Master decides the structure", "The Developers choose any structure and technique, as long as it focuses on progress toward the Sprint Goal and produces an actionable plan for the next day", "The Product Owner reviews the status of each item"],
    answer: 2,
    why: "The three questions are a typical practice, not a rule. The team is self-managing and picks its own technique." },
  { q: "What is the expected outcome of the Daily Scrum?",
    options: ["A status report for the Product Owner", "A revised Product Backlog", "A new Sprint Goal", "An adapted Sprint Backlog as necessary and a plan for the next working day"],
    answer: 3,
    why: "The Daily Scrum inspects progress toward the Sprint Goal and adapts the Sprint Backlog. The result is a plan for the Developers for the next working day." },
  { q: "Which statement best describes the Sprint Review?",
    options: ["A presentation by the Developers for stakeholders, followed by a sign-off", "A working meeting where the Scrum Team and stakeholders inspect the outcome of the Sprint and collaborate on what to do next", "A meeting to evaluate the performance of the team members", "A meeting for the Product Owner and the stakeholders only"],
    answer: 1,
    why: "The Sprint Review is not just a one-way presentation. It is a working meeting where everyone participates and the Product Backlog may be adjusted to meet new opportunities." },
  { q: "What is the main outcome of the Sprint Review?",
    options: ["A reviewed Increment and a possibly adjusted Product Backlog", "A new Definition of Done", "An approved release plan", "A list of improvements for the team's processes"],
    answer: 0,
    why: "The outcome is a reviewed Increment and a Product Backlog that may be adjusted. Process improvements belong to the Sprint Retrospective." },
  { q: "In which event is the Definition of Done adapted if needed?",
    options: ["Sprint Planning", "Daily Scrum", "Sprint Review", "Sprint Retrospective"],
    answer: 3,
    why: "In the Sprint Retrospective the Scrum Team inspects individuals, interactions, processes, tools and its Definition of Done, and plans improvements." },
  { q: "The Sprint Retrospective produces improvement ideas. What is true about adding them to the next Sprint Backlog?",
    options: ["It is mandatory to add them", "It is allowed but there is no obligation to do so", "It is forbidden", "Only the Product Owner may add them"],
    answer: 1,
    why: "The Scrum Team may add the most helpful improvements to the Sprint Backlog of the next Sprint, but this is no obligation." },
  { q: "What are the maximum timeboxes for the Sprint Review and the Sprint Retrospective in a one-month Sprint?",
    options: ["3 hours and 4 hours", "8 hours and 3 hours", "2 hours and 2 hours", "4 hours and 3 hours"],
    answer: 3,
    why: "The Sprint Review is at most 4 hours and the Sprint Retrospective at most 3 hours for a one-month Sprint. For shorter Sprints they are usually shorter." },
  { q: "Which event is the last event of the Sprint and concludes it?",
    options: ["Sprint Review", "Sprint Retrospective", "Daily Scrum", "Sprint Planning"],
    answer: 1,
    why: "The Sprint Retrospective is the last event and concludes the Sprint. The Sprint Review is the second-to-last." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
