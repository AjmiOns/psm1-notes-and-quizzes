<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 5: Scrum Team Accountabilities</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f5f2fc; --line: #d9d3ee;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #5b4b9a; --accent-tint: #e6e0f8; --on-accent: #ffffff;
    --ok: #2f7d5b; --ok-tint: #ddf3e8;
    --bad: #a8465e; --bad-tint: #fbe0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>5. Scrum Team Accountabilities</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "Which accountabilities make up a Scrum Team?",
    options: ["Product Owner, Scrum Master, Developers and a project manager", "Product Owner, Scrum Master and Developers", "Scrum Master, lead developer and Developers", "Product Owner, project manager and Developers"],
    answer: 1,
    why: "A Scrum Team consists of one Scrum Master, one Product Owner and Developers. There are no other accountabilities." },
  { q: "A team wants to add a project manager or a lead developer to its Scrum Team. What does Scrum say?",
    options: ["That is allowed if the team agrees", "That is allowed only for teams larger than 10 people", "That is not allowed: there are no sub-teams or hierarchies, and project managers outside the team are only stakeholders", "That is required for teams with more than one Product Owner"],
    answer: 2,
    why: "Within a Scrum Team there are no sub-teams or hierarchies. Roles like project or program manager can exist in the organization, but they are only stakeholders and never part of the Scrum Team." },
  { q: "How many Product Owners can a Scrum Team have for one product?",
    options: ["One per Developer", "Two, to share the workload", "As many as there are stakeholders", "Exactly one, per product and per Product Backlog"],
    answer: 3,
    why: "Several Product Owners could create conflicts when prioritizing the team's work, so there is only one Product Owner per product and per Product Backlog." },
  { q: "According to the course, what is the best measure of a product's value?",
    options: ["Number of app downloads", "Customer satisfaction", "Number of features delivered", "Hours worked by the team"],
    answer: 1,
    why: "Value is not only measured by things like downloads. The best measure of success and value is customer satisfaction." },
  { q: "The Product Owner lets a Developer create several Product Backlog items. Who is accountable for them?",
    options: ["The Developer who created them", "The Scrum Master", "The Product Owner, who remains accountable even when delegating", "The whole team equally"],
    answer: 2,
    why: "The Product Owner may delegate work to others, but remains accountable. Read such exam questions carefully." },
  { q: "What is the Definition of Done?",
    options: ["A list of tasks the Scrum Master assigns to Developers", "A formal description of the state of an Increment when it meets the quality measures required for the product", "The Product Owner's list of requirements", "The plan for the Sprint"],
    answer: 1,
    why: "The Developers instill quality by adhering to the Definition of Done. When a Product Backlog item meets it, a new Increment is born." },
  { q: "What does cross-functional mean for a Scrum Team?",
    options: ["Every Developer must be an expert in all required technologies", "The team members work on several products at once", "The team combined has all skills needed to create a potentially releasable Increment", "The team depends on other teams for missing skills"],
    answer: 2,
    why: "Cross-functionality does not mean that each Developer is an expert in everything. The team as a whole must be able to do all the work required." },
  { q: "A team is new to Scrum and resists the Daily Scrum. What should the Scrum Master do?",
    options: ["Force the Developers to attend", "Cancel the Daily Scrum", "Coach the team on the benefits of the Daily Scrum without forcing anyone", "Moderate the Daily Scrum every day"],
    answer: 2,
    why: "The Scrum Master role is a coaching role: they teach and help the team understand the advantages, but do not force anyone." },
  { q: "Which statement about the Scrum Master and Scrum events is correct?",
    options: ["The Scrum Master must always moderate every event", "The Scrum Master ensures events take place and are positive, productive and within the timebox, and teaches the team to keep them effective", "The Scrum Master decides the agenda of the Daily Scrum", "The Scrum Master attends only the Sprint Review"],
    answer: 1,
    why: "The Scrum Master is not the permanent moderator. They ensure the events take place and teach the team to be effective, for example to keep them within the timebox." },
  { q: "Who decides how a Product Backlog item is turned into an Increment, and who assigns tasks during the Sprint?",
    options: ["The Product Owner", "The Scrum Master", "The Developers only if the Product Owner agrees", "The Scrum Team, because it is self-managing (what, when and how)"],
    answer: 3,
    why: "Self-managing means the team controls what, when and how. The what comes from the Product Owner's Product Backlog ordering, and the how is up to the team as long as the Increment meets the Definition of Done." },
  { q: "What does Scrum recommend about team size, and what should happen if the team becomes too large?",
    options: ["Exactly 7 people; split the work between two Product Owners", "10 or fewer including the Product Owner and Scrum Master; reorganize into several Scrum Teams sharing the same Product Goal, Product Backlog and Product Owner", "At least 12 people; add a team lead", "No limit; the Scrum Master decides"],
    answer: 1,
    why: "Smaller teams communicate better and are more productive. If a team gets too large, multiple Scrum Teams focused on the same product should share the Product Goal, Product Backlog and Product Owner." },
  { q: "Which description best fits the Scrum Master as a servant leader?",
    options: ["Leading by title and giving orders to the team", "Serving others, not oneself: helping people develop and perform as highly as possible and promoting team ownership", "Taking over the decisions of the Product Owner", "Managing the project plan and assigning work"],
    answer: 1,
    why: "Servant leadership, first described by Robert K. Greenleaf, is about serving others and not yourself, and not leading by title. It matches the agile values of individuals and interactions and customer collaboration." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
