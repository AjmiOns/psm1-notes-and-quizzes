<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 1: Introduction</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f8f6fd; --line: #e3def4;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #7d6cc0; --accent-tint: #ebe6f9; --on-accent: #ffffff;
    --ok: #4a9c78; --ok-tint: #e1f5ec;
    --bad: #c06a82; --bad-tint: #fce6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>1. Introduction</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "Why was Scrum created?",
    options: ["To replace software development with manual processes", "For a world where software is transforming everything, becoming more complex, and customer needs constantly evolve", "To make projects longer and more predictable", "To remove the need for customers in product development"],
    answer: 1,
    why: "Scrum was created for a complex, fast-changing world in which requirements and customer needs keep evolving." },
  { q: "Which of the following is a problem of traditional, plan-driven approaches?",
    options: ["They deliver too often", "They bring in feedback too early", "They focus on efficiency over value and have no feedback loops, so the software may be outdated when it ships", "They have too many accountabilities"],
    answer: 2,
    why: "Without feedback loops, the software is often outdated or misses user needs by the time it ships." },
  { q: "What is the purpose of Scrum in short?",
    options: ["To deliver more frequently, incorporate customer feedback as early as possible and generate better outcomes and more value", "To reduce the team to a single person", "To produce detailed plans before any work starts", "To measure the efficiency of each team member"],
    answer: 0,
    why: "Scrum is an evolution of project management that delivers more often and brings in feedback early." },
  { q: "Which three accountabilities make up the Scrum Team?",
    options: ["Project Manager, Product Owner and Developers", "Product Owner, Scrum Master and Developers", "Scrum Master, Team Lead and Developers", "Product Owner, Stakeholders and Developers"],
    answer: 1,
    why: "A Scrum Team consists of one Product Owner, one Scrum Master and Developers." },
  { q: "Who represents users, customers and other stakeholders and is accountable for the Product Backlog?",
    options: ["The Scrum Master", "The Developers", "The Product Owner", "The stakeholders"],
    answer: 2,
    why: "The Product Owner is accountable for managing the Product Backlog and maximizing the value of the product." },
  { q: "Who decides internally who does what in a Scrum Team?",
    options: ["The Developers, because they are self-managing", "The Product Owner", "The Scrum Master", "The stakeholders"],
    answer: 0,
    why: "Developers do all the work needed to turn Product Backlog items into releasable Increments and decide internally who does what." },
  { q: "What is the Scrum Master accountable for?",
    options: ["Deciding which items the Developers select", "Making sure Scrum is understood and enacted", "Ordering the Product Backlog", "Writing the code"],
    answer: 1,
    why: "The Scrum Master helps everyone understand Scrum theory, practices and rules." },
  { q: "What is a Sprint?",
    options: ["A fixed-length event of one month or less that creates consistency", "A meeting at the end of the project", "An event of variable length decided each time", "A list of all work for the product"],
    answer: 0,
    why: "Scrum Teams work in Sprints, iterations of one month or less." },
  { q: "Which event starts a Sprint, creating the Sprint Backlog based on a Sprint Goal?",
    options: ["Daily Scrum", "Sprint Review", "Sprint Planning", "Sprint Retrospective"],
    answer: 2,
    why: "In Sprint Planning the Scrum Team creates the Sprint Backlog based on a Sprint Goal." },
  { q: "What is the Daily Scrum?",
    options: ["A one-hour meeting for the whole company", "A 15-minute event where the Developers inspect and adapt progress toward the Sprint Goal and talk about next steps and impediments", "A daily report to the Product Owner", "A meeting that replaces the Sprint Review"],
    answer: 1,
    why: "It is an event for the Developers and helps them plan the next day of work." },
  { q: "What happens in the Sprint Review?",
    options: ["The Scrum Team plans ways to improve internally", "The Product Backlog is closed", "The Scrum Team inspects the outcome of the Sprint with stakeholders and receives feedback", "The Sprint Backlog is created"],
    answer: 2,
    why: "The Product Owner and relevant stakeholders are invited, and the team collaborates with them on what to do next." },
  { q: "What is the purpose of the Sprint Retrospective?",
    options: ["To present the Increment to stakeholders", "To estimate the Product Backlog", "To select the next Sprint Goal alone", "To discuss and plan ways to increase quality and effectiveness internally"],
    answer: 3,
    why: "It is the last event of the Sprint and concludes it." },
  { q: "What is the Product Backlog?",
    options: ["The Developers' plan for one Sprint", "A list of all the work that might be needed in the future, ordered by value, and the Product Owner is accountable for it", "A list of finished Increments", "The Scrum Master's list of impediments"],
    answer: 1,
    why: "The Product Backlog is the single list of work for the product." },
  { q: "Who creates the Sprint Backlog, and when?",
    options: ["The Product Owner, before the Sprint", "The Scrum Master, in the Daily Scrum", "The stakeholders, in the Sprint Review", "The Scrum Team, in Sprint Planning, based on the Sprint Goal"],
    answer: 3,
    why: "The Sprint Backlog contains the Sprint Goal, the selected items and the plan." },
  { q: "What is an Increment?",
    options: ["A planning document", "Releasable, working software that grows and allows the team to inspect and adapt its work", "A list of meetings", "A stakeholder request"],
    answer: 1,
    why: "Each Increment adds to the previous ones." },
  { q: "What is the Definition of Done in the introduction?",
    options: ["The Product Owner's wish list", "The plan for the next Sprint", "A report for stakeholders", "A shared reference the team keeps at hand during the Sprint"],
    answer: 3,
    why: "It tells the Developers what quality an Increment must have to be considered done." },
  { q: "How does the Scrum Guide 2020 describe the Scrum Master?",
    options: ["As a project manager who assigns tasks", "As a true leader who serves the Scrum Team and the wider organization", "As a technical lead who decides how to build", "As an optional role"],
    answer: 1,
    why: "Older material says 'servant leader'. The 2020 Guide describes the Scrum Master as a true leader who serves." },
  { q: "Who has the final say on the ordering of the Product Backlog?",
    options: ["The Developers", "The Scrum Master", "The stakeholders vote", "The Product Owner"],
    answer: 3,
    why: "Ordering is the Product Owner's call. Value is a key consideration, but not the only one." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
