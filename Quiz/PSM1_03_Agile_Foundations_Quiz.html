<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSM I Quiz 3: Agile Foundations</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f5f2fc; --line: #d9d3ee;
    --text: #2e3a4f; --muted: #6b7a90;
    --accent: #5b4b9a; --accent-tint: #e6e0f8; --on-accent: #ffffff;
    --ok: #2f7d5b; --ok-tint: #ddf3e8;
    --bad: #a8465e; --bad-tint: #fbe0e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161d; --surface: #201f29; --line: #3a3750;
      --text: #e7e8ee; --muted: #9aa3b5;
      --accent: #a99bea; --accent-tint: #2c2745; --on-accent: #17161d;
      --ok: #6cc9a0; --ok-tint: #17302a;
      --bad: #f08aa3; --bad-tint: #3a1f29;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  header { margin-bottom: 24px; }
  .tag { margin: 0 0 4px; font-size: 14px; font-weight: 600; color: var(--accent); }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  .progress { display: flex; align-items: center; gap: 12px; margin: 20px 0 24px; font-size: 14px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--accent-tint); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .q { margin: 0 0 18px; font-size: 20px; line-height: 1.4; font-weight: 600; }
  .options { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
  .opt {
    width: 100%; text-align: left; padding: 13px 16px; font: inherit; color: inherit;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt:disabled { cursor: default; }
  .letter { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-tint); color: var(--accent);
            font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .opt.correct { background: var(--ok-tint); border-color: var(--ok); }
  .opt.correct .letter { background: var(--ok); color: var(--on-accent); }
  .opt.wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.wrong .letter { background: var(--bad); color: var(--on-accent); }
  .opt.dim { opacity: .55; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--accent-tint); border-radius: 0 8px 8px 0; }
  .feedback.ok { border-color: var(--ok); background: var(--ok-tint); }
  .feedback.bad { border-color: var(--bad); background: var(--bad-tint); }
  .feedback strong { display: block; margin-bottom: 2px; }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 0; }
  button.primary, button.secondary {
    font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent);
  }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .score { font-size: 40px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
  .review { margin: 24px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .review li { padding: 10px 14px; border-radius: 8px; border-left: 4px solid; font-size: 15px; }
  .review li.ok { border-color: var(--ok); background: var(--ok-tint); }
  .review li.bad { border-color: var(--bad); background: var(--bad-tint); }
  .review small { display: block; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="tag">PSM I | Knowledge check</p>
    <h1>3. Agile Foundations</h1>
  </header>

  <section id="quiz" aria-live="polite">
    <div class="progress"><span id="count"></span><div class="bar"><span id="fill"></span></div></div>
    <h2 class="q" id="question"></h2>
    <ul class="options" id="options"></ul>
    <div id="feedback" class="feedback" hidden></div>
    <div class="actions"><button class="primary" id="next" hidden>Next question</button></div>
  </section>

  <section id="result" hidden>
    <p class="tag">Result</p>
    <div class="score" id="score"></div>
    <p id="verdict"></p>
    <ul class="review" id="review"></ul>
    <div class="actions">
      <button class="primary" id="retryMissed" hidden>Retry missed questions</button>
      <button class="secondary" id="restart">Restart quiz</button>
    </div>
  </section>
</main>

<script>
// To reuse for another chapter, edit only this array (and the <title>/<h1> above).
// answer = index of the correct option in "options".
const QUESTIONS = [
  { q: "Which statement best describes agile, as defined in this course?",
    options: ["Agile is a mindset and nothing else", "Agile means using Scrum", "Agile is an adaptive way to work on and create products, which minimizes the risk of not meeting the customer's expectations", "Agile is a plan-driven way to deliver a fully finished product at the end"],
    answer: 2,
    why: "Agile is adaptive, not predictive: teams collaborate with customers, get feedback early on versions of the product and adapt. A mindset is needed but is not enough, and Scrum is only one framework that follows agile." },
  { q: "What is the relationship between agile and Scrum?",
    options: ["They are the same thing", "Agile is a concept, Scrum is a framework for software development", "Agile is a framework, Scrum is a mindset", "Scrum is the only way to be agile"],
    answer: 1,
    why: "Mixing up agility (a concept) with Scrum (a framework) is a common mistake. Scrum tries to follow agile values and principles, but they are not the same thing." },
  { q: "When and by whom was the Agile Manifesto created?",
    options: ["In 1999 by Kent Beck alone", "In spring 2001 by 17 very experienced software developers", "In 2020 by the Scrum Guide authors", "In 2010 by a group of project managers"],
    answer: 1,
    why: "The Manifesto for Agile Software Development was created in spring 2001 by 17 very experienced software developers. It contains 4 values and 12 principles." },
  { q: "Who are the creators of Scrum?",
    options: ["Kent Beck and Jeff Sutherland", "Kent Beck and Ken Schwaber", "Jeff Sutherland and Ken Schwaber", "Ken Schwaber and a project manager from PMI"],
    answer: 2,
    why: "Jeff Sutherland and Ken Schwaber created Scrum. Kent Beck is one of the three founders of Extreme Programming, a different agile approach." },
  { q: "Which statement about agile values and Scrum values is correct?",
    options: ["The 4 agile values and the 5 Scrum values are the same list", "There are 5 agile values, and the Scrum values are part of the exam", "There are 4 agile values, and only the 5 Scrum values are part of the PSM I exam", "Neither set of values matters for the exam"],
    answer: 2,
    why: "Students often mix them up. The Agile Manifesto has 4 values. Scrum has 5 values, and only these are examined, although knowing the agile values helps you understand agile." },
  { q: "Why does agile value \"individuals and interactions over processes and tools\"?",
    options: ["Because processes and tools are forbidden in agile", "Because people who can interact and collaborate solve problems better than a new process or tool, which tends to be less responsive to change", "Because tools are too expensive", "Because individuals should work alone to be faster"],
    answer: 1,
    why: "Adding a more sophisticated process or tool does not always solve a problem. Agile is about adapting fast, and processes and tools by nature respond less to changing requirements and customer needs." },
  { q: "What does \"working software over comprehensive documentation\" mean?",
    options: ["Agile does not value documentation at all", "Documentation is streamlined, and working software is the best indicator of success", "Documentation must be written before any software", "Only large projects need documentation"],
    answer: 1,
    why: "Agile does not dispose of documentation, it streamlines it. Documentation can be written months ago and says little about success, while working software shows real progress." },
  { q: "In classical projects, when is the customer typically involved, which is why agile prefers \"customer collaboration over contract negotiation\"?",
    options: ["Throughout the entire project, every day", "Only at the beginning (contract), for contract changes and at the final handover", "Only during testing", "Never"],
    answer: 1,
    why: "In classical projects developers focus on what is written in the contract without further interaction with the customer, so the product often misses expectations. Agile favors collaboration and constant feedback." },
  { q: "According to the 12 agile principles, what is the primary measure of progress?",
    options: ["A detailed project plan", "Comprehensive documentation", "Hours worked by the team", "Working software"],
    answer: 3,
    why: "Principle 7 says working software is the primary measure of progress. It is not documentation or a detailed plan, but the product that should satisfy the customer." },
  { q: "For which project is agile the better approach than waterfall?",
    options: ["An IT transition replacing an application with a newer version without new features", "A project whose scope is 100% fixed and well understood", "An online shop where requirements keep changing and customer feedback is needed early", "Any project, since agile is always better"],
    answer: 2,
    why: "Agile fits when scope cannot be fixed because requirements change and you must adapt quickly. A fixed-scope IT transition is a classic case where waterfall still works well. It depends on the project." }
];

const $ = id => document.getElementById(id);
const letters = "ABCD";
let pool = [], idx = 0, results = [];

function start(list) {
  pool = list.slice(); idx = 0; results = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show() {
  const item = pool[idx];
  $("count").textContent = "Question " + (idx + 1) + " of " + pool.length;
  $("fill").style.width = (idx / pool.length * 100) + "%";
  $("question").textContent = item.q;
  $("feedback").hidden = true; $("next").hidden = true;
  const ul = $("options"); ul.innerHTML = "";
  item.options.forEach((text, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.innerHTML = '<span class="letter">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click", () => choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function choose(i) {
  const item = pool[idx], right = i === item.answer;
  results.push({ item, right });
  [...$("options").querySelectorAll(".opt")].forEach((b, n) => {
    b.disabled = true;
    if (n === item.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (right ? "ok" : "bad");
  fb.innerHTML = "<strong></strong><p></p>";
  fb.firstChild.textContent = right ? "Correct" : "Wrong. The answer is " + letters[item.answer] + ".";
  fb.lastChild.textContent = item.why;
  fb.hidden = false;
  $("fill").style.width = ((idx + 1) / pool.length * 100) + "%";
  const next = $("next");
  next.textContent = idx === pool.length - 1 ? "See results" : "Next question";
  next.hidden = false; next.focus();
}

$("next").addEventListener("click", () => {
  if (idx === pool.length - 1) return finish();
  idx++; show();
});

function finish() {
  $("quiz").hidden = true; $("result").hidden = false;
  const got = results.filter(r => r.right).length, total = results.length;
  $("score").textContent = got + " / " + total;
  const pct = got / total;
  $("verdict").textContent = pct === 1 ? "Perfect score. Move on to the next chapter."
    : pct >= 0.8 ? "Solid. Review the questions you missed below."
    : "Re-read the chapter notes, then retry the questions you missed.";
  const ul = $("review"); ul.innerHTML = "";
  results.forEach(r => {
    const li = document.createElement("li");
    li.className = r.right ? "ok" : "bad";
    li.textContent = (r.right ? "Correct: " : "Missed: ") + r.item.q;
    if (!r.right) {
      const s = document.createElement("small");
      s.textContent = "Answer: " + r.item.options[r.item.answer];
      li.appendChild(s);
    }
    ul.appendChild(li);
  });
  const missed = results.filter(r => !r.right).map(r => r.item);
  $("retryMissed").hidden = missed.length === 0;
  $("retryMissed").onclick = () => start(missed);
  window.scrollTo(0, 0);
}

$("restart").addEventListener("click", () => start(QUESTIONS));
start(QUESTIONS);
</script>
</body>
</html>
